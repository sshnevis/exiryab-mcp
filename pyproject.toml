[project]
name = "exiryab-mcp"
version = "0.1.0"
description = "Official read-only MCP server for ExirYab (exiryab.com): find Iranian doctors by name, city and specialty, with profile links, clinic phones, hours and map locations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ExirYab" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "exiryab", "iran", "doctor", "clinic", "healthcare", "persian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://exiryab.com"
Source = "https://github.com/sshnevis/exiryab-mcp"
Changelog = "https://github.com/sshnevis/exiryab-mcp/releases"
Issues = "https://github.com/sshnevis/exiryab-mcp/issues"

[project.scripts]
exiryab-mcp = "exiryab_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real exiryab.com API (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
